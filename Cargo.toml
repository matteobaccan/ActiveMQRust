# ActiveMQRust by Matteo Baccan
# SPDX-License-Identifier: MIT

[package]
name = "mqrust"
version = "0.3.1"
edition = "2021"
description = "ActiveMQRust: an in-memory OpenWire message broker compatible with Apache ActiveMQ"
authors = ["Matteo Baccan"]
license = "MIT"
repository = "https://github.com/matteobaccan/ActiveMQRust"
build = "build.rs"

[lib]
name = "mqrust"
path = "src/lib.rs"

[[bin]]
name = "mqrust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = "0.6"
getrandom = "0.4"
rpassword = "7"
parking_lot = "0.12"
mimalloc = { version = "0.1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "form"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.10"
quick-xml = "0.41"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
toml_edit = "0.22"

# Windows only: the service (Service Control Manager), process memory and affinity.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# macOS only: process memory for the admin console (proc_pid_rusage).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "selectors"
harness = false

[[bench]]
name = "expiry"
harness = false

# Used by build.rs only when the target is Windows (version resource).
[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
