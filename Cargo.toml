# ActiveMQRust by Matteo Baccan
# SPDX-License-Identifier: MIT

[package]
name = "mqrust"
version = "0.1.0"
edition = "2021"
description = "ActiveMQRust: an in-memory OpenWire message broker compatible with Apache ActiveMQ"
authors = ["Matteo Baccan"]
license = "MIT"
repository = "https://github.com/matteobaccan/ActiveMQRust"
build = "build.rs"

[lib]
name = "mqrust"
path = "src/lib.rs"

[[bin]]
name = "mqrust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = { version = "0.5", features = ["std"] }
rpassword = "7"
parking_lot = "0.12"
mimalloc = { version = "0.1", default-features = false }
windows-service = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
serde_json = "1"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
toml_edit = "0.22"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "broker"
harness = false

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
