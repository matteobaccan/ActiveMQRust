# ActiveMQRust configuration for the comparison benchmark: the benchmark user is set and
# broker compression is enabled above 32 KB (measurement (e) measures it; the default is 0 = off).

[broker]
bind = "127.0.0.1"
compress_threshold_kb = 32

[admin]
username = "admin"
password = "admin"

[[users]]
username = "admin"
password = "admin"
