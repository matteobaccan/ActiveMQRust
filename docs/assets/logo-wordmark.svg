<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128" role="img" aria-labelledby="title">
  <!-- ActiveMQRust by Matteo Baccan - SPDX-License-Identifier: MIT -->
  <title id="title">ActiveMQRust</title>
  <style>
    .mq { fill: #4A4A4A; }
    @media (prefers-color-scheme: dark) { .mq { fill: #E6E6E6; } }
  </style>
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8703A"/>
      <stop offset="1" stop-color="#A3361A"/>
    </linearGradient>
    <!-- Oxidised metal: copper highlights over rust browns. -->
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4A261"/>
      <stop offset="0.35" stop-color="#D9692F"/>
      <stop offset="0.65" stop-color="#B7410E"/>
      <stop offset="1" stop-color="#6E2A0C"/>
    </linearGradient>
    <!-- Moving light reflection across the word. -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF4E6" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0; 520 0; 520 0" keyTimes="0; 0.45; 1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- Corrosion texture: noise darkens and pits the metal. -->
    <filter id="corrode" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.07  0 0 0 0 0.02  0 0 0 2.2 -0.85" result="pits"/>
      <feComposite in="pits" in2="SourceGraphic" operator="in" result="pitsOnText"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="pitsOnText"/>
      </feMerge>
    </filter>
    <filter id="emboss" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#3A1405" flood-opacity="0.55"/>
    </filter>
  </defs>
  <path d="M64 6 L114 35 L114 93 L64 122 L14 93 L14 35 Z" fill="url(#hex)" stroke="#7A2812" stroke-width="4" stroke-linejoin="round"/>
  <rect x="24" y="61" width="80" height="6" rx="3" fill="#7A2812" opacity="0.45"/>
  <g stroke="#7A2812" stroke-width="3" stroke-linejoin="round">
    <rect x="22" y="48" width="22" height="32" rx="4" fill="#FFFFFF" opacity="0.55"/>
    <rect x="47" y="48" width="22" height="32" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="72" y="48" width="22" height="32" rx="4" fill="#FFFFFF"/>
  </g>
  <path d="M72 52 L83 62 L94 52" fill="none" stroke="#7A2812" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 64 L108 64 M103 58 L109 64 L103 70" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mq" x="134" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="600">ActiveMQ</text>
  <g font-family="Segoe UI Black, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="900">
    <text x="350" y="81" fill="url(#rust)" stroke="#5A1F08" stroke-width="1.2" filter="url(#emboss)">Rust</text>
    <text x="350" y="81" fill="url(#rust)" filter="url(#corrode)">Rust</text>
    <text x="350" y="81" fill="url(#shine)">Rust</text>
  </g>
</svg>
